name: Auto Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.1). Empty = auto-increment. Use "init" for first release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        shell: bash
        run: |
          # 1. Pushed a v* tag -> use it
          TRIGGER="${{ github.event_name }}"
          REF="${{ github.ref }}"
          if [ "$TRIGGER" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "source=tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Manual dispatch with explicit version
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "init" ]; then
            echo "tag=$INPUT" >> "$GITHUB_OUTPUT"
            echo "source=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Auto increment from the highest existing semver tag
          LAST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LAST" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "source=auto-init" >> "$GITHUB_OUTPUT"
          else
            MAJOR=$(echo "$LAST" | sed 's/v\([0-9]*\)\..*/\1/')
            MINOR=$(echo "$LAST" | cut -d. -f2)
            PATCH=$(echo "$LAST" | cut -d. -f3)
            echo "tag=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
            echo "source=auto-increment" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi
          gh release create "$TAG" --generate-notes --title "$TAG" --notes "自动化发布 $TAG"